title: Microsoft Entra Agent ID on Kubernetes
description: A comprehensive guide to setting up Microsoft Entra Agent ID on Kubernetes
baseurl: "/entra-agent-id-agw"
url: "https://blog.christianposta.com"
theme: jekyll-theme-cayman
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true

# Theme customization
show_downloads: false
github: [metadata]
github_username: christian-posta
github_repository: entra-agent-id-agw

# Exclude files that shouldn't be processed
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .venv
  - __pycache__
  - "*.ps1"
  - .env
  - "*.key"
  - ai-agent-cli
  - entra-agent-cli
  - kubernetes
  - workload-id-kind
  - demo
